[video]
source = "http://TONYPI_IP:8080/?action=stream"
width = 640
height = 480
fps = 10.0
frame_timeout_seconds = 0.75

[detection]
lab_min = [30, 132, 100]
lab_max = [220, 215, 150]
processing_width = 640
processing_height = 480
gaussian_blur_kernel = 3
morphology_kernel = 3
minimum_contour_area = 50.0
