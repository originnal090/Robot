[video]
source = "http://127.0.0.1:8080/?action=stream"
width = 640
height = 480
fps = 10.0
# The Unity EDITOR throttles Play Mode while unfocused, so frame gaps can reach
# ~1 s even with runInBackground; the real-robot 0.75 s default would false-stop.
frame_timeout_seconds = 2.0

[detection]
# Tuned on 200 captured robot frames (see artifacts/eval-output): the ball reads
# A 133-190 while background clutter stays at A <= ~138, so A is the discriminator.
# Wide L/B bounds avoid clipping the shaded edges of the small (~25 px) ball, which
# used to break circularity; minimum_circularity 0.60 keeps small rasterized disks.
# Factory calibration (artifacts/factory-probe-*.png, 10 renders at 3-22 m):
# the lit corridor reads the ball at L 67-82 / A 154-176 while the grey floor
# sits at A~128 and deep shadows at L<35; the directional light leaves only a
# lit crescent (circularity ~0.37), so the disk-tuned 0.60 threshold is cut.
lab_min = [50, 150, 100]
lab_max = [220, 215, 150]
processing_width = 640
processing_height = 480
# The synthetic stream is noise-free, and a 3x3 blur smears the ball's soft
# rendered edge into a 1.2 aspect streak that scores circularity ~0.58.
gaussian_blur_kernel = 1
morphology_kernel = 3
# The factory ball sits ~25 m from the firefighter's default spot; at that
# range it spans only a few pixels.
minimum_contour_area = 30.0
# An off-axis projected sphere legitimately dips to ~0.55; blur-off keeps the
# crisp blob near 0.85.
# The factory's directional light leaves only a lit crescent on the ball
# (measured circularity 0.37 at 3 m); 0.25 accepts the crescent while racks
# and thin structures still fail the aspect filter.
minimum_circularity = 0.20
# Calibrated on the probe renders: lit ball crescent reads A 150-176, the grey
# factory floor sits at A~128.
core_a_min = 150
minimum_core_fraction = 0.15
minimum_aspect_ratio = 0.60
maximum_aspect_ratio = 1.67
# The Unity EDITOR throttles Play Mode while unfocused; two consecutive hits
# are enough to confirm the (clean, high-contrast) virtual ball at low fps.
confirmation_frames = 2
release_frames = 5

[controller]
# Simulator loop latency (throttled editor + TCP round trip) makes each
# steering correction overshoot; a wider approach-entry band and a smaller
# minimum steer let ALIGNING converge instead of head-shaking around center.
# The factory's directional light makes the detector lock onto the ball's lit
# CRESCENT, whose centroid sits ~0.1-0.15 off the true ball centre; a narrow
# entry band never sees a crossing frame. 0.20/0.26 accepts the biased error
# and lets APPROACHING's own corrections finish the job.
align_enter_error = 0.38
align_exit_error = 0.48
# The quick-start ball is 0.7 m across; radius-ratio 0.18 fires at ~1.7 m
# true distance. 0.55 stops the robot with the ball filling the view (~0.6 m
# centre-to-centre, ball surface ~0.25 m from the robot nose).
arrival_radius_ratio = 0.30
slow_radius_ratio = 0.18
search_steer = 0.35
# The rocking scan (reverse every N s) only covers +/- rate*N around the
# starting heading; 8 s at 10.5 deg/s sweeps +/-84 deg, enough to bring the
# distant cart-mounted ball into view from the default spawn heading.
search_reverse_seconds = 8.0
# A full 360-degree sweep at 10.5 deg/s needs ~34 s; 12 s gave up before the
# ball came back around in cluttered factory layouts.
max_search_seconds = 45.0
align_steer_gain = 1.2
approach_steer_gain = 0.9
align_steer_max = 0.60
approach_steer_max = 0.35
far_speed = 0.25
near_speed = 0.21
minimum_active_steer = 0.10
align_frames = 3
misalign_frames = 2
arrival_frames = 3
lost_frames = 3

[robot]
backend = "tcp"
host = "127.0.0.1"
port = 5075
connect_timeout_seconds = 3.0
send_interval_seconds = 0.10

[unity]
# Optional schema-v1 autonomy_status stream for the Unity simulator/recorder.
enabled = true
host = "127.0.0.1"
port = 6102
frame_rate_hz = 10.0
target_freshness_ms = 500
source = "hcirobot"
maximum_datagram_bytes = 4096

[obstacle]
# Reactive avoidance only: simulator DIST telemetry is the primary source,
# the vision heuristic is an experimental fallback when DIST data is stale/absent.
enabled = true
stop_mm = 250.0        # enter caution: hold position
avoid_mm = 150.0       # deep obstruction: trigger avoid maneuver
clear_mm = 350.0       # hysteresis: must see this far before resuming
stale_after_s = 1.0    # sonar reading older than this falls back to vision
trigger_frames = 2     # consecutive valid readings below stop_mm before acting
max_avoids = 3         # more avoid maneuvers than this -> latched BLOCKED
backup_velocity = -0.35
backup_seconds = 0.5
turn_steer = 0.35
turn_seconds = 0.6
cooldown_seconds = 1.0
vision_enabled = true
vision_trigger_frames = 4
vision_occupancy_ratio = 0.35
