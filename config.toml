[video]
source = "synthetic"
width = 640
height = 480
fps = 10.0
frame_timeout_seconds = 1.5

[detection]
# Capture development set (2026-09-14): A >= 136 separates the near ball from
# warm background while retaining the existing shape and strong-red-core gates.
# Wide L/B bounds retain shaded edges; see docs/edge-recognition.md for evaluation.
lab_min = [30, 136, 100]
lab_max = [220, 215, 150]
processing_width = 640
processing_height = 480
gaussian_blur_kernel = 3
morphology_kernel = 3
minimum_contour_area = 50.0
minimum_circularity = 0.60
# Rejects warm wood/foam textures (A <= ~147 in the captured scene): a candidate blob
# must contain >= 15% strongly red pixels (A >= 160). The real ball scores ~0.6.
core_a_min = 160
minimum_core_fraction = 0.15
minimum_aspect_ratio = 0.60
maximum_aspect_ratio = 1.67
confirmation_frames = 3
release_frames = 3

[controller]
# 到达（ARRIVED）后自动下发的一次性动作，使用课程 CMD 按钮名：
# right_grip = 蹲下灭火（outfire 动作组）；留空 "" 关闭。
arrival_action = "right_grip"
# 真机标定（2026-09-14 场地采集帧 capture-20260914-091540）：贴脸时球被画面
# 底边裁剪，半径比封顶 ~0.13，frame-01447（approached）实测 ~0.10。
arrival_radius_ratio = 0.10
slow_radius_ratio = 0.06
# 接近模式：fast_then_slow（远快近慢）| normal | normal_then_slow（默认）
# | slow_realtime（慢速连续，无走走停停）。前三种按 走->停->识别 循环，
# 走的时长随球变大而缩短（越近识别越频繁）。速度值对应机器人端三档动作组：
# <=0.45 one_step / <=0.75 常速 / >0.75 fast。
approach_mode = "normal_then_slow"
# 转向/横移执行一次，收到 DONE 后才开始 settle。需新版 STEP_V1 机器人服务。
# 旧课程服务或未实现 STEP 的仿真可显式设为 false，使用定时窗口。
single_step_turns = true
step_timeout_seconds = 10.0
walk_seconds_far = 1.5
walk_seconds_near = 0.5
settle_seconds = 0.4
sense_seconds = 0.7
# 识别窗口保持静止；下列时长是小步/普通档请求窗口，不控制单步转角。
# 小偏差或跨侧后的修正使用小步档；时间不再按偏差插值或跨侧减半。
turn_seconds_near = 0.18
turn_seconds_far = 0.45
turn_full_error = 0.45
# 可选：近距离、小偏差用慢速横移；真机步幅未标定，默认关闭。
near_lateral_enabled = false
near_lateral_max_error = 0.25
near_lateral_speed = 0.30
align_enter_error = 0.08
align_exit_error = 0.14
search_steer = 0.35
search_reverse_seconds = 2.0
max_search_seconds = 12.0
align_steer_gain = 1.2
approach_steer_gain = 0.9
align_steer_max = 0.60
approach_steer_max = 0.35
far_speed = 0.25
near_speed = 0.21
minimum_active_steer = 0.25
align_frames = 3
misalign_frames = 2
arrival_frames = 3
lost_frames = 3

[robot]
backend = "recording"
host = "127.0.0.1"
port = 5075
connect_timeout_seconds = 3.0
send_interval_seconds = 0.10

[unity]
# Optional schema-v1 autonomy_status stream for the Unity simulator/recorder.
enabled = false
host = "127.0.0.1"
port = 6102
frame_rate_hz = 10.0
target_freshness_ms = 500
source = "hcirobot"
maximum_datagram_bytes = 4096

[obstacle]
# Reactive avoidance only: sonar telemetry from robot_side is the primary source,
# the vision heuristic is an experimental fallback when sonar data is stale/absent.
enabled = true
stop_mm = 250.0        # enter caution: hold position
avoid_mm = 150.0       # deep obstruction: trigger avoid maneuver
clear_mm = 350.0       # hysteresis: must see this far before resuming
stale_after_s = 1.0    # sonar reading older than this falls back to vision
trigger_frames = 2     # consecutive valid readings below stop_mm before acting
max_avoids = 3         # more avoid maneuvers than this -> latched BLOCKED
backup_velocity = -0.35
backup_seconds = 0.5
turn_steer = 0.35
turn_seconds = 0.6
cooldown_seconds = 1.0
vision_enabled = true
vision_trigger_frames = 4
vision_occupancy_ratio = 0.35
