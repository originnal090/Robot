[video]
source = "synthetic"
width = 640
height = 480
fps = 10.0
frame_timeout_seconds = 1.5

[detection]
# Tuned on 200 captured robot frames (see artifacts/eval-output): the ball reads
# A 133-190 while background clutter stays at A <= ~138, so A is the discriminator.
# Wide L/B bounds avoid clipping the shaded edges of the small (~25 px) ball, which
# used to break circularity; minimum_circularity 0.60 keeps small rasterized disks.
lab_min = [30, 132, 100]
lab_max = [220, 215, 150]
processing_width = 640
processing_height = 480
gaussian_blur_kernel = 3
morphology_kernel = 3
minimum_contour_area = 50.0
minimum_circularity = 0.60
# Rejects warm wood/foam textures (A <= ~147 in the captured scene): a candidate blob
# must contain >= 15% strongly red pixels (A >= 160). The real ball scores ~0.6.
core_a_min = 160
minimum_core_fraction = 0.15
minimum_aspect_ratio = 0.60
maximum_aspect_ratio = 1.67
confirmation_frames = 3
release_frames = 3

[controller]
# 到达（ARRIVED）后自动下发的一次性动作，使用课程 CMD 按钮名：
# right_grip = 蹲下灭火（outfire 动作组）；留空 "" 关闭。
arrival_action = "right_grip"
align_enter_error = 0.08
align_exit_error = 0.14
arrival_radius_ratio = 0.18
slow_radius_ratio = 0.10
search_steer = 0.35
search_reverse_seconds = 2.0
max_search_seconds = 12.0
align_steer_gain = 1.2
approach_steer_gain = 0.9
align_steer_max = 0.60
approach_steer_max = 0.35
far_speed = 0.25
near_speed = 0.21
minimum_active_steer = 0.25
align_frames = 3
misalign_frames = 2
arrival_frames = 3
lost_frames = 3

[robot]
backend = "recording"
host = "127.0.0.1"
port = 5075
connect_timeout_seconds = 3.0
send_interval_seconds = 0.10

[unity]
# Optional schema-v1 autonomy_status stream for the Unity simulator/recorder.
enabled = false
host = "127.0.0.1"
port = 6102
frame_rate_hz = 10.0
target_freshness_ms = 500
source = "hcirobot"
maximum_datagram_bytes = 4096

[obstacle]
# Reactive avoidance only: sonar telemetry from robot_side is the primary source,
# the vision heuristic is an experimental fallback when sonar data is stale/absent.
enabled = true
stop_mm = 250.0        # enter caution: hold position
avoid_mm = 150.0       # deep obstruction: trigger avoid maneuver
clear_mm = 350.0       # hysteresis: must see this far before resuming
stale_after_s = 1.0    # sonar reading older than this falls back to vision
trigger_frames = 2     # consecutive valid readings below stop_mm before acting
max_avoids = 3         # more avoid maneuvers than this -> latched BLOCKED
backup_velocity = -0.35
backup_seconds = 0.5
turn_steer = 0.35
turn_seconds = 0.6
cooldown_seconds = 1.0
vision_enabled = true
vision_trigger_frames = 4
vision_occupancy_ratio = 0.35
